data:
  source_data_dir: "/kaggle/input/datasets/lucasiturriago/bananaripeness/Original"
  synthetic_data_dir: "/kaggle/input/datasets/lucasiturriago/bananaripeness/Synthetic"
  batch_size: 32
  img_size: 224
  num_workers: 4
  imagenet_mean: [0.485, 0.456, 0.406]
  imagenet_std: [0.229, 0.224, 0.225]

model:
  num_classes: 4
  pretrained: false
  backbone: "resnet"
  dropout_rate: 0.2

training:
  epochs: 25
  lr: 0.0001
  transfer_epochs: 25
  epochs_phases: [0,5,10,15]
  transfer_lr: 0.00001
  gamma: 0.94
  use_amp: true
  device: "cuda"
  seed: 42

experiment:
  name: "transfer_resnet_experiment"
  version: 1
  output_dir: "outputs/resnet/experiment_1"