[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "banana_creda"
version = "0.1.0"
description = "Domain Adaptation for Banana Ripeness Using CREDA"
authors = [{ name = "Lucas Iturriago", email = "liturriago@unal.edu.co" }]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.14.0",
    "torchvision>=0.29.0"
    "pydantic>=2.0.0",
    "pyyaml",
    "numpy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "umap-learn",
    "kagglehub",
    "tqdm",
    
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "isort",
    "mypy"
]

explain = [
    "captum>=0.7.0"
]

convert = [
    "executorch>=1.5.1",
    "torchao>=0.18.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "-v -ra"

[tool.setuptools.packages.find]
where = ["src"]